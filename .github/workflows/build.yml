name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential cmake ninja-build

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install PySide6 and dependencies
        run: |
          python -m pip install --upgrade pip wheel
          # Instalamos PySide6 completo, el deployer viene dentro
          pip install "PySide6==6.7.3" tomlkit jinja2 pkginfo tqdm

      - name: Download Android wheels for PySide6 and Shiboken
        run: |
          mkdir -p wheels
          # Descargamos las wheels compiladas específicamente para Android (aarch64)
          pip download PySide6 shiboken6 \
            --only-binary=:all: \
            --platform manylinux_2_28_aarch64 \
            --python-version 3.11 \
            --implementation cp \
            --abi cp311 \
            -d wheels/
          
          # Exportamos las rutas exactas a variables de entorno para el siguiente paso
          echo "PYSIDE_WHEEL=$(ls wheels/PySide6-*.whl | head -1)" >> $GITHUB_ENV
          echo "SHIBOKEN_WHEEL=$(ls wheels/shiboken6-*.whl | head -1)" >> $GITHUB_ENV

      - name: Init Android project
        run: |
          mkdir -p android && cd android
          # Ahora le pasamos las wheels descargadas
          pyside6-android-deploy --init \
            --wheel-pyside="${{ env.PYSIDE_WHEEL }}" \
            --wheel-shiboken="${{ env.SHIBOKEN_WHEEL }}"

      - name: Copy source files
        run: |
          cp core.py          android/src/core.py
          cp main.py          android/src/main.py
          cp mobile_main.py   android/src/mobile_main.py
          cp desktop_main.py  android/src/desktop_main.py
          cp pyproject.toml   android/pyproject.toml

      - name: Build APK
        run: |
          cd android
          # Pasamos las wheels de nuevo para el empaquetado final
          pyside6-android-deploy \
            --wheel-pyside="../${{ env.PYSIDE_WHEEL }}" \
            --wheel-shiboken="../${{ env.SHIBOKEN_WHEEL }}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: textucreator-debug-apk
          path: android/build/android/gradle/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/build/**/*.log
            android/build/**/*.txt
          retention-days: 7
