name: Inspect Qt Download Links

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Check available PySide6 versions
        run: |
          echo "=== Contenido de la carpeta de PySide6 ==="
          curl -s https://download.qt.io/official_releases/QtForPython/pyside6/ | grep -o 'href="[^"]*"' | head -50
          
          echo "=== Contenido de la carpeta 6.7.3 ==="
          curl -s https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.7.3-src/ | grep -o 'href="[^"]*"' | head -50
