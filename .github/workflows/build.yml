name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk build-essential cmake ninja-build wget unzip

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install PySide6 dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install PySide6==6.7.3 jinja2 pkginfo tqdm tomlkit

      - name: Download PySide6 Android wheels
        run: |
          mkdir -p wheels && cd wheels
          
          # URL base de las releases de PySide6
          BASE_URL="https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.7.3-src"
          
          # Descargar la wheel de PySide6 y shiboken6 para Android
          wget -q $BASE_URL/PySide6-6.7.3-cp39-abi3-linux_aarch64.whl || \
          wget -q $BASE_URL/PySide6-6.7.3-cp311-cp311-linux_aarch64.whl
          
          wget -q $BASE_URL/shiboken6-6.7.3-cp39-abi3-linux_aarch64.whl || \
          wget -q $BASE_URL/shiboken6-6.7.3-cp311-cp311-linux_aarch64.whl
          
          ls -la
          echo "PYSIDE_WHEEL=$(pwd)/$(ls PySide6-*.whl | head -1)" >> $GITHUB_ENV
          echo "SHIBOKEN_WHEEL=$(pwd)/$(ls shiboken6-*.whl | head -1)" >> $GITHUB_ENV

      - name: Init Android project
        run: |
          mkdir -p android && cd android
          pyside6-android-deploy --init \
            --wheel-pyside="${{ env.PYSIDE_WHEEL }}" \
            --wheel-shiboken="${{ env.SHIBOKEN_WHEEL }}"

      - name: Copy source files
        run: |
          cp core.py          android/src/core.py
          cp main.py          android/src/main.py
          cp mobile_main.py   android/src/mobile_main.py
          cp desktop_main.py  android/src/desktop_main.py
          cp pyproject.toml   android/pyproject.toml

      - name: Build APK
        run: |
          cd android
          pyside6-android-deploy \
            --wheel-pyside="${{ env.PYSIDE_WHEEL }}" \
            --wheel-shiboken="${{ env.SHIBOKEN_WHEEL }}"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: textucreator-debug-apk
          path: android/build/android/gradle/build/outputs/apk/debug/*.apk
          retention-days: 30
